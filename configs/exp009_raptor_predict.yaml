# exp009 — 5-fold Raptor 체크포인트(epoch 13, 외부 종료로 SWA 전에 멈춤)로 train 전체 이미지 OOF를 만든다.
# fold k 체크포인트는 fold k의 pseudo study를 빼고 학습됐다 → 그 study 예측이 OOF.
# 학습 없음. 결과: oof_pseudo.csv(4,349), oof.csv(정답 58, 5개 평균), metrics.json
trainer: raptor_predict
seed: 0

model:
  name: raptor
  backbone: coatnet_rmlp_2_rw_384.sw_in12k_ft_in1k
  pretrained: false
  dropout: 0.2
  grad_ckpt: false

corpus_dir: raptor_corpus
labels_file: labels_dread.csv
checkpoint_repo: cheolhhh9846/RSNA-Knee-Abnormality-Detection_hk
fold_checkpoints:
  0: 20261006-002403-37247f
  1: 20261006-002434-d60476
  2: 20261006-002503-2b0fe2
  3: 20261006-002533-aea6be
  4: 20261006-002706-c8214c

# exp007과 같은 평가 창
input: raptor_stack
slots: SLOTS44
span: [0.15, 0.85]
img: 336
crop_mm: 140.0
res: 384
k_eval: 24
batch_size: 8
amp: true
num_workers: 8
