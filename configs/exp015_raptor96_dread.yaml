# exp015 — exp014와 같고 라벨만 공개 Raptor 라벨(labels_dread.csv, exp007과 같음)로 바꾼다.
# 질문: 정제 라벨 모델(exp013·exp014)은 공개 0.956 혼합에서 0.955로 떨어졌고, 공개 라벨 모델(exp007·v2·mean 포함 5모델)은 0.956을 지켰다.
# 라벨이 원인이면 이 모델은 혼합에서 떨어지지 않아야 한다.
trainer: raptor
seed: 15
data_repo: cheolhhh9846/rsna-knee-raptor-corpus

model:
  name: raptor
  backbone: coatnet_rmlp_2_rw_384.sw_in12k_ft_in1k
  pretrained: true
  dropout: 0.2
  grad_ckpt: true

corpus_dir: raptor_corpus96
mirror_slots: [26, 22, 18, 12, 18]   # SLOTS96 칸별 장수 → 학습 때 절반 확률로 3D 좌우 거울상

input: raptor_stack
slots: SLOTS96
span: [0.02, 0.98]
img: 384
crop_mm: 140.0
labels_file: labels_dread.csv
holdout_fold: null

res: 384                     # 코퍼스가 이미 384 → 늘이지 않는다
k: 12
k_eval: 42                   # 96장에서 고르게 42개 (nartaa는 94 + 거울상)
epochs: 16
batch_size: 8
lr: 1.0e-3
backbone_lr: 3.0e-5
pct_start: 0.15
weight_decay: 2.0e-2
grad_clip: 3.0
swa_last: 3
amp: true
num_workers: 8
