# exp007 — 공개 Raptor 방식(단일 CoAtNet LB 0.924)을 우리 코드로 재구현해 학습한다.
# 입력: 공개 코퍼스 dreaddevelopment/knee-raptor-corpus(+ext) — study마다 44×336×336 uint8 스택
#   (시상 fluid 12 / 시상 non-fluid 10 / 관상 fluid 8 / 관상 6 / 축상 8, 시리즈 15–85% 구간, 140 mm 자르기)
#   우리 build_stack()이 train DICOM에서 코퍼스와 비트 단위로 같은 스택을 만든다 (7 study 확인).
# 모델: CoAtNet-rmlp-2 384 전체 미세조정 + 소견별 attention-MIL.
# 라벨: 공개 Raptor와 같은 dreaddevelopment LLM soft 라벨(+ 정답 58) — 먼저 재현을 검증한다.
trainer: raptor
seed: 42

model:
  name: raptor
  backbone: coatnet_rmlp_2_rw_384.sw_in12k_ft_in1k
  pretrained: true
  dropout: 0.2
  grad_ckpt: true            # bs 8 × 12창 × 384px를 24 GB에 넣는다 (공개 측정 23.7 GB)

corpus_dir: raptor_corpus

# Kaggle 추론(DICOM → 같은 스택)용. 학습은 코퍼스를 그대로 읽는다
input: raptor_stack
slots: SLOTS44
span: [0.15, 0.85]
img: 336
crop_mm: 140.0
labels_file: labels_dread.csv
holdout_fold: null           # 학습 데이터를 줄이지 않는다 (공개: 코퍼스 확대가 +0.013)

res: 384
k: 12                        # 학습: study마다 무작위 창 12개
k_eval: 24                   # 평가: 고르게 24개
epochs: 16
batch_size: 8
lr: 1.0e-3                   # 헤드
backbone_lr: 3.0e-5
pct_start: 0.15
weight_decay: 2.0e-2
grad_clip: 3.0
swa_last: 3                  # 마지막 3 epoch 가중치 평균 (정답 58로 epoch를 고르지 않는다)
amp: true
num_workers: 8
