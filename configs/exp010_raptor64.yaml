# exp010 — exp007(Raptor CoAtNet)과 같은 절차, 입력만 64장·구간 6–94% 코퍼스(우리가 train DICOM에서 직접 생성).
# 공개 원작자: 구간 확대가 Lateral Meniscus·측부인대에 유리. 제3자 재현 정답 58 0.930 / LB 0.939.
trainer: raptor
seed: 64

model:
  name: raptor
  backbone: coatnet_rmlp_2_rw_384.sw_in12k_ft_in1k
  pretrained: true
  dropout: 0.2
  grad_ckpt: true            # bs 8 × 12창 × 384px를 24 GB에 넣는다 (공개 측정 23.7 GB)

corpus_dir: raptor_corpus64

# Kaggle 추론(DICOM → 같은 스택)용. 학습은 코퍼스를 그대로 읽는다
input: raptor_stack
slots: SLOTS64
span: [0.06, 0.94]
img: 336
crop_mm: 140.0
labels_file: labels_dread.csv
holdout_fold: null           # 학습 데이터를 줄이지 않는다 (공개: 코퍼스 확대가 +0.013)

res: 384
k: 12                        # 학습: study마다 무작위 창 12개
k_eval: 24                   # 평가: 고르게 24개
epochs: 16
batch_size: 8
lr: 1.0e-3                   # 헤드
backbone_lr: 3.0e-5
pct_start: 0.15
weight_decay: 2.0e-2
grad_clip: 3.0
swa_last: 3                  # 마지막 3 epoch 가중치 평균 (정답 58로 epoch를 고르지 않는다)
amp: true
num_workers: 8
