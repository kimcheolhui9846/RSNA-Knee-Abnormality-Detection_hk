[project]
name = "rsna-knee"
version = "0.1.0"
description = "RSNA Knee Abnormality Detection (Kaggle) — macro AUC over 12 labels"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "pyyaml",
    "pydicom",
    "pylibjpeg",
    "pylibjpeg-libjpeg",
    "pylibjpeg-openjpeg",
    "iterative-stratification",
    "opencv-python-headless",
]

[project.optional-dependencies]
# GPU 학습용. 테스트·EDA만 할 때는 설치하지 않아도 된다: uv sync --extra train
train = [
    "torch",
    "torchvision",
    "timm",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"
# 문서 안 예시 코드(handoff 등)는 lint 대상이 아니다
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
# smoke 테스트가 fold마다 가중치를 쓰므로 통과한 테스트의 tmp_path는 남기지 않는다 (WSL /tmp는 RAM)
tmp_path_retention_policy = "failed"
